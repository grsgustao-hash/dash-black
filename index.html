 document.getElementById("bar").innerHTML=P.map(p=>`<button class="${preset==p[0]?"on":""}" data-p="${p[0]}">${p[1]}</button>`).join("")+`<span class="na">de</span><input type="date" id="f" value="${from}" min="${D.since}" max="${D.until}"><span class="na">até</span><input type="date" id="t" value="${to}" min="${D.since}" max="${D.until}">`;
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const p=P.find(x=>x[0]==b.dataset.p);[from,to]=p[2]();preset=p[0];render()});
 f.onchange=()=>{from=f.value;preset="";render()};t.onchange=()=>{to=t.value;preset="";render()};
}
let c1,c2;
const ptot=(a)=>({spend:a.reduce((s,r)=>s+r[2],0),imp:a.reduce((s,r)=>s+r[3],0),clicks:a.reduce((s,r)=>s+r[4],0),leads:a.reduce((s,r)=>s+r[5],0)});
function dlt(cur,prev,inv){if(prev==null||cur==null||!prev)return"";const p=(cur-prev)/prev*100;if(Math.abs(p)<1)return`<span class="delta">= igual</span>`;const good=inv?p<0:p>0;return`<span class="delta ${good?"up":"dn"}">${p>0?"▲":"▼"} ${Math.abs(p).toFixed(0)}% vs. período anterior</span>`}
function bkt(arr,title){const m={};arr.filter(r=>r[0]>=from&&r[0]<=to).forEach(r=>{const g=m[r[1]]=m[r[1]]||[];g.push(r)});
 const L=Object.entries(m).map(([k,a])=>({k,...ptot(a.map(r=>r))})).filter(x=>x.spend>0).sort((a,b)=>b.spend-a.spend).slice(0,8);const mx=Math.max(...L.map(x=>x.spend),1);
 return L.length?tbl([title,"Gasto","Leads","CPL",""],L.map(x=>{const c=x.leads?x.spend/x.leads:null;return[esc(x.k.replace("facebook","FB").replace("instagram","IG").replace("_"," ")),brl(x.spend),x.leads,`<b class="${cls(c)}">${brl(c)}</b>`,`<div class="bar2" style="width:${x.spend/mx*100}%"></div>`]})):"Sem dados no período."}
const lk=(n,u)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`:esc(n);
const sum=a=>({spend:a.reduce((s,r)=>s+r[3],0),imp:a.reduce((s,r)=>s+r[4],0),clicks:a.reduce((s,r)=>s+r[5],0),leads:a.reduce((s,r)=>s+r[6],0)});
const tbl=(h,rows)=>"<table><tr>"+h.map(x=>`<th>${x}</th>`).join("")+"</tr>"+rows.map(r=>"<tr>"+r.map(x=>`<td>${x}</td>`).join("")+"</tr>").join("")+"</table>";
function group(rows,k){const m={};rows.forEach(r=>{(m[r[k]]=m[r[k]]||[]).push(r)});return Object.entries(m).map(([id,a])=>({id,...sum(a)})).map(g=>({...g,cpl:g.leads?g.spend/g.leads:null,ctr:g.imp?g.clicks/g.imp*100:0}))}
function days0(a,b){return Math.round((new Date(b)-new Date(a))/864e5)+1}
function render(){
 bar();
 const rows=D.rows.filter(r=>r[0]>=from&&r[0]<=to);const T=sum(rows);T.cpl=T.leads?T.spend/T.leads:null;T.ctr=T.imp?T.clicks/T.imp*100:0;
 document.getElementById("sub").textContent=`Conta PROCRASTINADORES · campanhas BLACK · ${fmt(from)} a ${fmt(to)} · atualizado ${D.gerado} · só tráfego pago`;
 const len=days0(from,to);const pf=add(from,-len),pt=add(from,-1);const prow=D.rows.filter(r=>r[0]>=pf&&r[0]<=pt);const first=D.rows.reduce((m,r)=>r[0]<m?r[0]:m,"9");const hasP=prow.length>0&&pf>=first;
 const PT=sum(prow);PT.cpl=PT.leads?PT.spend/PT.leads:null;PT.ctr=PT.imp?PT.clicks/PT.imp*100:0;
 const cg=group(rows,1).sort((a,b)=>b.spend-a.spend),ag=group(rows,2).sort((a,b)=>b.spend-a.spend);
 const act=cg.filter(c=>D.camps[c.id]?.s=="ACTIVE").length;
 kpis.innerHTML=`<div class="kpi"><span>Investimento</span><b>${brl(T.spend)}</b>${hasP?dlt(T.spend,PT.spend):""}<small>${T.imp.toLocaleString("pt-BR")} impressões</small></div>
 <div class="kpi"><span>Leads</span><b>${T.leads}</b>${hasP?dlt(T.leads,PT.leads):""}<small>${T.clicks.toLocaleString("pt-BR")} cliques no link · CTR ${T.ctr.toFixed(2).replace(".",",")}%</small></div>
 <div class="kpi"><span>CPL médio</span><b class="${cls(T.cpl)}">${brl(T.cpl)}</b>${hasP?dlt(T.cpl,PT.cpl,1):""}<small>meta R$ 4,00 · teto R$ 7,00</small></div>
 <div class="kpi"><span>Campanhas ativas</span><b>${act}/${cg.length}</b><small>${ag.filter(a=>D.ads[a.id]?.s=="ACTIVE").length} anúncios ativos</small></div>`;
 const cpc=T.clicks?T.spend/T.clicks:null,lpv=rows.reduce((s,r)=>s+r[7],0),cplv=lpv?T.spend/lpv:null;
 const pcpc=PT.clicks?PT.spend/PT.clicks:null,plpv=prow.reduce((s,r)=>s+r[7],0),pcplv=plpv?PT.spend/plpv:null;
 kpis2.innerHTML=`<div class="kpi"><span>Custo por clique</span><b>${brl(cpc)}</b>${hasP?dlt(cpc,pcpc,1):""}</div>
 <div class="kpi"><span>Custo por visualização da página</span><b>${brl(cplv)}</b>${hasP?dlt(cplv,pcplv,1):""}<small>${lpv.toLocaleString("pt-BR")} visualizações</small></div>
 <div class="kpi"><span>Clique → página</span><b>${T.clicks?(lpv/T.clicks*100).toFixed(0):"—"}%</b><small>quem clicou e carregou a página</small></div>
 <div class="kpi"><span>Página → lead</span><b>${lpv?(T.leads/lpv*100).toFixed(0):"—"}%</b><small>quem viu a página e virou lead</small></div>`;
 // projeção do dia
 const hoje=D.rows.filter(r=>r[0]==today),H=sum(hoje),now=new Date(),fr=(now.getHours()+now.getMinutes()/60)/24;
 proj.innerHTML=(to==today&&H.spend>0&&fr>.33)?`Hoje até agora: ${brl(H.spend)} e ${H.leads} leads. No ritmo atual, fecha o dia perto de ${brl(Math.round(H.spend/fr/10)*10)} e ${Math.round(H.leads/fr)} leads.`:"";
 // alertas
 const al=[];ag.forEach(a=>{const m=D.ads[a.id];if(m.s!="ACTIVE")return;if(a.spend>=15&&a.leads==0)al.push([m.n,`gastou ${brl(a.spend)} sem nenhum lead — considerar pausar`]);else if(a.leads&&a.cpl>D.teto&&a.spend>=30)al.push([m.n,`CPL ${brl(a.cpl)}, acima do teto de ${brl(D.teto)} (gasto ${brl(a.spend)}) — considerar pausar`])});
 alerts.innerHTML=al.length?`<h2>Pedem atenção</h2>`+al.slice(0,8).map(x=>`<div class="alert">${esc(x[0])}<small>${x[1]}</small></div>`).join(""):`<h2>Pedem atenção</h2><div class="na">Nenhum anúncio ativo fora do padrão neste período.</div>`;
 pl.innerHTML=bkt(D.pl,"Posicionamento");document.getElementById("ag").innerHTML=bkt(D.ag,"Idade · gênero");
 const days=[];for(let d=from;d<=to;d=add(d,1))days.push(d);
 const byd=days.map(d=>sum(rows.filter(r=>r[0]==d)));
 const L=days.map(fmt),cp=byd.map(x=>x.leads?+(x.spend/x.leads).toFixed(2):null);
 c1&&c1.destroy();c2&&c2.destroy();
 Chart.defaults.color="#9a9484";Chart.defaults.borderColor="#2a2824";Chart.defaults.font.family="Helvetica Neue,Arial";
 c1=new Chart(document.getElementById("c1"),{type:"bar",data:{labels:L,datasets:[{data:byd.map(x=>x.leads),backgroundColor:"#ece7da",borderRadius:0,barPercentage:.7}]},options:{animation:false,plugins:{legend:{display:false}}}});
 c2=new Chart(document.getElementById("c2"),{type:"line",data:{labels:L,datasets:[{data:cp,borderColor:"#ece7da",borderWidth:1.5,fill:false,tension:0,spanGaps:true,pointBackgroundColor:cp.map(v=>v==null?"#888":v<=D.meta?"#6cc785":v<=D.teto?"#e0a43c":"#e5675a")},{data:L.map(()=>D.meta),borderColor:"#6cc78599",borderDash:[5,5],pointRadius:0},{data:L.map(()=>D.teto),borderColor:"#e5675a99",borderDash:[5,5],pointRadius:0}]},options:{animation:false,plugins:{legend:{display:false}}}});
 // ranking por nome de anúncio
 const byn={};ag.forEach(a=>{const n=D.ads[a.id].n;const g=byn[n]=byn[n]||{n,spend:0,leads:0,t:D.ads[a.id].t,u:D.ads[a.id].u};g.spend+=a.spend;g.leads+=a.leads});
 const rk=Object.values(byn).filter(g=>g.leads&&g.spend>=D.min).map(g=>({...g,cpl:g.spend/g.leads})).sort((a,b)=>a.cpl-b.cpl).slice(0,8);
 rkh.textContent=`Melhores criativos (menor CPL, gasto ≥ R$ ${D.min})`;
 document.getElementById("rk").innerHTML=rk.length?rk.map((r,i)=>`<div class="rk"><span class="n">${i+1}</span>${r.t?`<img src="${esc(r.t)}">`:""}<div><b>${lk(r.n,r.u)}</b><small>${brl(r.spend)} · ${r.leads} leads</small></div><b class="${cls(r.cpl)} big">${brl(r.cpl)}</b></div>`).join(""):"Nenhum criativo com gasto mínimo neste período.";
 ct.innerHTML=tbl(["Campanha","Status","Gasto","Leads","CPL","CTR"],cg.map(c=>[esc(D.camps[c.id].n.slice(0,70)),pill(D.camps[c.id].s),brl(c.spend),c.leads,`<b class="${cls(c.cpl)}">${brl(c.cpl)}</b>`,c.ctr.toFixed(2).replace(".",",")+"%"]));
 at.innerHTML=tbl(["Anúncio","Campanha","Status","Gasto","Leads","CPL","CTR","Freq."],ag.map(a=>{const m=D.ads[a.id];const r=rows.find(x=>x[2]==a.id);return[lk(m.n,m.u),esc(D.camps[r[1]].n.slice(0,40)),pill(m.s),brl(a.spend),a.leads,`<b class="${cls(a.cpl)}">${brl(a.cpl)}</b>`,a.ctr.toFixed(2).replace(".",",")+"%",(D.fq[a.id]?D.fq[a.id][1].toFixed(1).replace(".",","):"—")]}));
}
render();
</script></body></html>
